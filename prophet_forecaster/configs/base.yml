# Base Configuration for Data Ingestion
# This file contains common settings shared across all environments

# Yahoo Finance Settings
yahoo_finance:
  rate_limit_pause: 0.5  # Pause between requests in seconds
  max_retries: 3         # Maximum number of retry attempts

# Logging Configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Visualization Settings
visualization:
  style: "seaborn"
  dpi: 300
  format: "png"

# Default Parameters
defaults:
  interval: "1d"
  lookback_days: 365  # Default period for historical data
  batch_size: 10      # Number of symbols to process in parallel 